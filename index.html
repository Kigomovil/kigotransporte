<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Moto Taxi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:0;font-family:Arial,sans-serif;background:#f3f3f3;color:#222}.app{width:100%;max-width:600px;margin:auto;background:#fff;min-height:100vh}#map{width:100%;height:55vh;min-height:350px}.panel{background:#fff;padding:16px;border-radius:22px 22px 0 0;margin-top:-22px;position:relative;z-index:1000;box-shadow:0 -4px 18px rgba(0,0,0,.15)}.title{font-size:21px;font-weight:bold;margin-bottom:5px}.subtitle{font-size:13px;color:#777;margin-bottom:15px}.step{padding:13px;border-radius:13px;background:#f5f5f5;margin-bottom:10px}.step-title{font-size:12px;color:#777;margin-bottom:5px}.address{font-size:14px;font-weight:bold;line-height:19px}.waiting{color:#999;font-weight:normal}.mode{display:flex;gap:8px;margin-bottom:12px}.mode button{flex:1;margin:0;padding:11px;border-radius:10px;border:1px solid #ddd;background:#fff;color:#555;font-size:13px;font-weight:bold}.mode button.active{background:#e53935;color:#fff;border-color:#e53935}.info{display:flex;gap:8px;margin-top:10px}.info-box{flex:1;background:#f5f5f5;padding:12px 8px;border-radius:12px;text-align:center}.info-label{font-size:11px;color:#777}.info-value{font-size:16px;font-weight:bold;margin-top:5px}.price{margin-top:12px;padding:15px;background:#111;color:#fff;border-radius:14px;display:flex;justify-content:space-between;align-items:center}.price-label{font-size:13px}.price-value{font-size:24px;font-weight:bold}.confirm{width:100%;border:none;padding:16px;border-radius:14px;margin-top:14px;background:#e53935;color:white;font-size:17px;font-weight:bold}.confirm:disabled{background:#aaa}.status{text-align:center;font-size:12px;color:#777;margin-top:9px}.pickup-icon,.destination-icon{width:38px;height:38px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.35);border:3px solid white}.pickup-icon{background:#e53935}.destination-icon{background:#111}.marker-dot{width:11px;height:11px;background:white;border-radius:50%}.map-message{position:absolute;top:15px;left:50%;transform:translateX(-50%);z-index:999;background:white;padding:9px 14px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:12px;font-weight:bold;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
<div style="position:relative"><div id="map"></div><div id="mapMessage" class="map-message">Toca el mapa para indicar la recogida</div></div>
<div class="panel">
<div class="title">Solicita tu moto</div>
<div id="subtitle" class="subtitle">Selecciona el lugar donde te recogeremos.</div>
<div class="mode"><button id="pickupMode" class="active">Recogida</button><button id="destinationMode">Destino</button></div>
<div class="step"><div class="step-title">PUNTO DE RECOGIDA</div><div id="pickupAddress" class="address waiting">Toca el mapa para seleccionar</div></div>
<div class="step"><div class="step-title">DESTINO</div><div id="destinationAddress" class="address waiting">Toca el mapa para seleccionar</div></div>
<div class="info"><div class="info-box"><div class="info-label">DISTANCIA</div><div id="distance" class="info-value">—</div></div><div class="info-box"><div class="info-label">TIEMPO APROX.</div><div id="duration" class="info-value">—</div></div></div>
<div class="price"><div class="price-label">VALOR ESTIMADO</div><div id="price" class="price-value">$0</div></div>
<button id="confirmButton" class="confirm" disabled>CONFIRMAR VIAJE</button>
<div id="status" class="status"></div>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TARIFA_MINIMA=35,VALOR_POR_KM_ADICIONAL=5,NUMERO_WHATSAPP="524182371993";
let pickupLat=null,pickupLng=null,destinationLat=null,destinationLng=null,pickupAddress="",destinationAddress="",pickupMarker=null,destinationMarker=null,routeLayer=null,modoSeleccion="pickup";
const map=L.map("map",{zoomControl:false,attributionControl:true});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
function iniciarMapa(lat,lng){map.setView([lat,lng],16)}
if(navigator.geolocation){navigator.geolocation.getCurrentPosition(function(p){iniciarMapa(p.coords.latitude,p.coords.longitude)},function(){iniciarMapa(21.1561,-100.9333)},{enableHighAccuracy:true,timeout:10000})}else{iniciarMapa(21.1561,-100.9333)}
document.getElementById("pickupMode").addEventListener("click",function(){modoSeleccion="pickup";this.classList.add("active");document.getElementById("destinationMode").classList.remove("active");document.getElementById("mapMessage").innerText="Toca el mapa para indicar la recogida";document.getElementById("subtitle").innerText="Selecciona el lugar donde te recogeremos."});
document.getElementById("destinationMode").addEventListener("click",function(){modoSeleccion="destination";this.classList.add("active");document.getElementById("pickupMode").classList.remove("active");document.getElementById("mapMessage").innerText="Toca el mapa para indicar el destino";document.getElementById("subtitle").innerText="Selecciona a dónde quieres llegar."});
map.on("click",function(e){const lat=e.latlng.lat,lng=e.latlng.lng;if(modoSeleccion==="pickup"){pickupLat=lat;pickupLng=lng;if(pickupMarker)map.removeLayer(pickupMarker);pickupMarker=L.marker([lat,lng],{icon:crearIconoRecogida()}).addTo(map);obtenerDireccionRecogida(lat,lng);setTimeout(function(){modoSeleccion="destination";document.getElementById("pickupMode").classList.remove("active");document.getElementById("destinationMode").classList.add("active");document.getElementById("mapMessage").innerText="Ahora toca el mapa para indicar el destino";document.getElementById("subtitle").innerText="Selecciona el lugar donde quieres llegar."},800)}else{destinationLat=lat;destinationLng=lng;if(destinationMarker)map.removeLayer(destinationMarker);destinationMarker=L.marker([lat,lng],{icon:crearIconoDestino()}).addTo(map);obtenerDireccionDestino(lat,lng);if(pickupLat!==null&&pickupLng!==null)calcularRuta()}});
function crearIconoRecogida(){return L.divIcon({className:"",html:'<div class="pickup-icon"><div class="marker-dot"></div></div>',iconSize:[38,38],iconAnchor:[19,38]})}
function crearIconoDestino(){return L.divIcon({className:"",html:'<div class="destination-icon"><div class="marker-dot"></div></div>',iconSize:[38,38],iconAnchor:[19,38]})}
async function obtenerDireccionRecogida(lat,lng){document.getElementById("pickupAddress").innerText="Buscando dirección...";try{const r=await fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat="+lat+"&lon="+lng+"&zoom=18&addressdetails=1&accept-language=es"),d=await r.json();pickupAddress=d.display_name||"Dirección no encontrada";document.getElementById("pickupAddress").innerText=pickupAddress;actualizarGlide()}catch(e){document.getElementById("pickupAddress").innerText="No se pudo obtener la dirección."}}
async function obtenerDireccionDestino(lat,lng){document.getElementById("destinationAddress").innerText="Buscando dirección...";try{const r=await fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat="+lat+"&lon="+lng+"&zoom=18&addressdetails=1&accept-language=es"),d=await r.json();destinationAddress=d.display_name||"Dirección no encontrada";document.getElementById("destinationAddress").innerText=destinationAddress;actualizarGlide()}catch(e){document.getElementById("destinationAddress").innerText="No se pudo obtener la dirección."}}
function crearUrlGoogleMaps(){if(pickupLat===null||pickupLng===null||destinationLat===null||destinationLng===null)return"";return"https://www.google.com/maps/dir/?api=1&origin="+pickupLat+","+pickupLng+"&destination="+destinationLat+","+destinationLng+"&travelmode=driving"}
async function calcularRuta(){if(pickupLat===null||pickupLng===null||destinationLat===null||destinationLng===null)return;document.getElementById("status").innerText="Calculando ruta...";try{const r=await fetch("https://router.project-osrm.org/route/v1/driving/"+pickupLng+","+pickupLat+";"+destinationLng+","+destinationLat+"?overview=full&geometries=geojson"),d=await r.json();if(!d.routes||!d.routes.length){document.getElementById("status").innerText="No encontramos una ruta.";return}const ruta=d.routes[0],km=ruta.distance/1000,min=Math.round(ruta.duration/60);document.getElementById("distance").innerText=km.toFixed(1)+" km";document.getElementById("duration").innerText=min+" min";let valor=TARIFA_MINIMA;if(km>1)valor=TARIFA_MINIMA+Math.ceil(km-1)*VALOR_POR_KM_ADICIONAL;document.getElementById("price").innerText="$"+Math.round(valor);if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.geoJSON(ruta.geometry,{style:{weight:5,opacity:.8}}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[45,45]});document.getElementById("status").innerText="Ruta calculada";document.getElementById("confirmButton").disabled=false;actualizarGlide()}catch(e){document.getElementById("status").innerText="No se pudo calcular la ruta."}}
function obtenerDatos(){return{direccion_recogida:pickupAddress,latitud_recogida:pickupLat,longitud_recogida:pickupLng,direccion_destino:destinationAddress,latitud_destino:destinationLat,longitud_destino:destinationLng,distancia:document.getElementById("distance").innerText,tiempo_estimado:document.getElementById("duration").innerText,valor_viaje:document.getElementById("price").innerText,url_google_maps:crearUrlGoogleMaps(),estado:"Pendiente"}}
function actualizarGlide(){window.parent.postMessage({type:"MOTO_TAXI_DATA",data:obtenerDatos()},"*")}
function enviarWhatsApp(){const d=obtenerDatos(),url=d.url_google_maps,mensaje="NUEVA SOLICITUD DE VIAJE\n\nRUTA EN GOOGLE MAPS:\n"+url+"\n\nRECOGIDA:\n"+d.direccion_recogida+"\n\nDESTINO:\n"+d.direccion_destino+"\n\nDISTANCIA:\n"+d.distancia+"\n\nTIEMPO APROXIMADO:\n"+d.tiempo_estimado+"\n\nPRECIO:\n"+d.valor_viaje;window.open("https://wa.me/"+NUMERO_WHATSAPP+"?text="+encodeURIComponent(mensaje),"_blank")}
document.getElementById("confirmButton").addEventListener("click",function(){if(pickupLat===null||destinationLat===null){alert("Selecciona la recogida y el destino.");return}actualizarGlide();enviarWhatsApp();document.getElementById("status").innerText="Viaje confirmado."});
</script>
</body>
</html>
