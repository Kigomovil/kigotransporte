<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kigo xpress</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f3f4f6}
.app{max-width:500px;margin:auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}
#map{width:100%;height:62vh}.map-container{position:relative;overflow:hidden}
.panel{padding:16px;border-radius:22px 22px 0 0;margin-top:-18px;position:relative;z-index:1000;background:#fff;flex:1;box-shadow:0 -4px 20px rgba(0,0,0,.12)}
.step{background:#f7f7f8;border:1px solid #eee;padding:12px;border-radius:14px;margin-bottom:12px}
.colonia-input{width:100%;padding:14px 14px 14px 38px;border:1.5px solid #ddd;border-radius:12px;font-size:14px;font-weight:600;outline:none}
.suggestions{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.18);z-index:9999;display:none;max-height:300px;overflow-y:auto}
.suggestions.show{display:block}
.suggestion{padding:12px 14px;border-bottom:1px solid #f2f2f2;display:flex;gap:10px;align-items:center;cursor:pointer}
.btn-cotizar{width:100%;padding:16px;border:none;border-radius:14px;background:#E53935;color:#fff;font-weight:900;font-size:15px;margin-top:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.weather-widget{position:absolute;top:12px;right:12px;z-index:999;background:#fff;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:900;display:flex;align-items:center;gap:4px;box-shadow:0 2px 10px rgba(0,0,0,.25);border:1px solid #eee}
.weather-widget.lluvia{background:#dbeafe;color:#1e40af}.weather-widget.tormenta{background:#1e293b;color:#fff}
.rain-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:400;pointer-events:none;display:none;background:rgba(30,58,138,0.12)}.rain-overlay.active{display:block}
.rain{position:absolute;top:-20px;width:2px;height:16px;background:linear-gradient(to bottom, transparent, #9ec3ff);animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(0)}100%{transform:translateY(60vh)}}
.weather-badge{position:absolute;bottom:12px;left:12px;z-index:999;background:#1e3a8a;color:#fff;padding:7px 12px;border-radius:20px;font-size:11px;font-weight:900;display:none;box-shadow:0 2px 8px rgba(0,0,0,.3);align-items:center;gap:6px}.weather-badge.show{display:flex}
.weather-badge.tormenta{background:#7f1d1d}.weather-badge.moderada{background:#1e40af}.weather-badge.leve{background:#1e3a8a}
.reset-btn{position:absolute;top:12px;left:12px;z-index:999;background:#fff;border:1px solid #ddd;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99999;display:none;align-items:end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{width:100%;max-width:500px;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px 22px;animation:slideUp.25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.card-select{border:1.5px solid #e2e8f0;border-radius:16px;padding:14px;cursor:pointer;background:#fff}
.card-select.active{border-color:#111;background:#111;color:#fff}
.card-select.active *{color:#fff!important}
.price{font-size:22px;font-weight:900}
.btn-confirm{width:100%;height:52px;border:none;border-radius:14px;background:#111;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.btn-wa{width:100%;margin-top:8px;height:44px;border:1.5px solid #25D366;border-radius:12px;background:#fff;color:#25D366;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
</style>
</head>
<body>
<div class="app">
<div class="map-container">
<div id="map"></div>
<div style="position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:999;background:white; width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:2px; box-shadow:0 2px 10px rgba(0,0,0,.25);">
  <img src="https://firebasestorage.googleapis.com/v0/b/glide-prod.appspot.com/o/icon-images%2Fanonymous-ba983199-acce-404e-b058-c75e9633b325.jpeg?alt=media&token=a58284c1-111c-4874-b60f-35380cf5fbe3" style="width:32px; height:32px; border-radius:50%; object-fit:cover;">
</div>
<div class="reset-btn" id="resetBtn"><i data-lucide="rotate-ccw" style="width:16px"></i></div>
<div id="weatherWidget" class="weather-widget"><i data-lucide="sun" style="width:14px"></i> --°C</div>
<div id="rainOverlay" class="rain-overlay"></div>
<div id="weatherBadge" class="weather-badge"><i data-lucide="cloud-rain" style="width:14px;color:#fff"></i> <span id="weatherBadgeTxt">LLOVIENDO EN DOLORES</span></div>
</div>
<div class="panel">
<div class="step"><div style="font-size:11px;font-weight:800;color:#666;margin-bottom:6px">1. ¿DÓNDE RECOGER?</div><div class="input-wrapper" style="position:relative"><i data-lucide="map-pin" style="position:absolute;left:12px;top:15px;width:16px;color:#16a34a"></i><input id="pickupInput" class="colonia-input" placeholder="Escribe Centro o colonia..." autocomplete="off"><div id="pickupSuggestions" class="suggestions"></div></div></div>
<div class="step"><div style="font-size:11px;font-weight:800;color:#666;margin-bottom:6px">2. ¿DÓNDE ENTREGAR?</div><div class="input-wrapper" style="position:relative"><i data-lucide="flag" style="position:absolute;left:12px;top:15px;width:16px;color:#dc2626"></i><input id="destinationInput" class="colonia-input" placeholder="Escribe colonia..." autocomplete="off"><div id="destinationSuggestions" class="suggestions"></div></div></div>
<button id="calculateButton" class="btn-cotizar"><i data-lucide="calculator" style="width:18px;color:#fff"></i> COTIZAR SERVICIO</button>
</div>
</div>

<div id="modalTipo" class="modal-overlay" onclick="if(event.target==this) cerrarModal()">
<div class="modal">
<div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:16px">¿Cómo te quieres ir?</b><br><small style="color:#777" id="rutaResumen">Elige tu ruta</small></div><button onclick="cerrarModal()" style="width:32px;height:32px;border-radius:50%;border:1px solid #ddd;background:#fff"><i data-lucide="x" style="width:16px"></i></button></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">
<div id="cardMoto" class="card-select active" onclick="seleccionarTipo('moto')">
<div style="display:flex;justify-content:space-between"><i data-lucide="bike" style="width:22px"></i><span style="font-size:10px;background:#e0f2fe;color:#0284c7;padding:4px 8px;border-radius:999px;font-weight:800">BARATO</span></div>
<div style="margin-top:10px"><b>MOTO</b><br><small style="color:#64748b;font-size:11px">1 persona • Rápido</small></div>
<div style="margin-top:10px"><div class="price" id="precioMoto">$28 MXN</div><small style="font-size:11px;color:#64748b" id="detalleMoto">Llega 3 min</small></div>
</div>
<div id="cardCarro" class="card-select" onclick="seleccionarTipo('carro')">
<div style="display:flex;justify-content:space-between"><i data-lucide="car" style="width:22px"></i><span style="font-size:10px;background:#fef3c7;color:#d97706;padding:4px 8px;border-radius:999px;font-weight:800">COMODO</span></div>
<div style="margin-top:10px"><b>CARRO</b><br><small style="color:#64748b;font-size:11px">4 personas • Cajuela</small></div>
<div style="margin-top:10px"><div class="price" id="precioCarro">$55 MXN</div><small style="font-size:11px;color:#64748b" id="detalleCarro">Llega 5 min</small></div>
</div>
</div>
<div id="resumenSel" style="margin-top:14px;background:#111;color:#fff;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center"><div><small style="color:#94a3b8">SELECCIONADO</small><br><b id="selTitulo">MOTO • $28 MXN</b><br><small style="color:#94a3b8" id="selDetalle">De Centro a Santa Fe</small></div><div style="width:40px;height:40px;background:#E53935;border-radius:10px;display:flex;align-items:center;justify-content:center"><i data-lucide="bike" id="selIcon" style="width:20px;color:#fff"></i></div></div>
<button class="btn-confirm" onclick="confirmarViaje()"><i data-lucide="check" style="width:18px;color:#fff"></i> CONFIRMAR Y BUSCAR <span id="btnConfirmTipo">MOTO</span></button>
<button id="btnWa" class="btn-wa"><i data-lucide="message-circle" style="width:16px"></i> Compartir por WhatsApp</button>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CENTRO={lat:21.1561,lng:-100.9333};
let pickupLat=null,pickupLng=null,destinationLat=null,destinationLng=null,pickupMarker=null,destinationMarker=null,routeLayer=null,pickupName="",destName="",tipoSeleccionado='moto';
let extraLluvia=0,ultimaDistKm=0,ultimoTiempo=0,precioMoto=0,precioCarro=0;
const map=L.map("map",{zoomControl:false}).setView([CENTRO.lat,CENTRO.lng],14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
const pickupInput=document.getElementById("pickupInput"),destinationInput=document.getElementById("destinationInput"),pickupSuggestions=document.getElementById("pickupSuggestions"),destinationSuggestions=document.getElementById("destinationSuggestions");
const rainOverlay=document.getElementById("rainOverlay"),weatherBadge=document.getElementById("weatherBadge"),weatherWidget=document.getElementById("weatherWidget");

function distMts(lat1,lon1,lat2,lon2){const R=6371000;const dLat=(lat2-lat1)*Math.PI/180;const dLon=(lon2-lon1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
async function buscarColonias(t){const texto=t.toLowerCase();let resultados=[];if(texto.includes("centro")||texto.includes("cent")){resultados.push({lat:CENTRO.lat,lon:CENTRO.lng,name:"Centro - Zona Centro",direccion:"Centro, Dolores Hidalgo, Gto."});}const q=encodeURIComponent(t+", Dolores Hidalgo Guanajuato Mexico");try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=10&countrycodes=mx&accept-language=es`);const d=await r.json();const otros=d.map(x=>({lat:parseFloat(x.lat),lon:parseFloat(x.lon),name:x.display_name.split(",")[0],direccion:x.display_name}));resultados=[...resultados,...otros];}catch(e){}return resultados;}
function mostrar(c,res,tipo){c.innerHTML="";if(!res.length){c.innerHTML='<div style="padding:12px;text-align:center">Sin resultados</div>';c.classList.add("show");return;}res.forEach(r=>{const el=document.createElement("div");el.className="suggestion";el.innerHTML=`<div style="width:28px;height:28px;background:#111;border-radius:50%;display:flex;align-items:center;justify-content:center"><i data-lucide="map-pin" style="width:14px;color:#fff"></i></div><div><div style="font-weight:800;font-size:13px">${r.name}</div><div style="font-size:10px;color:#777">${r.direccion.substring(0,70)}</div></div>`;el.onclick=()=>{if(tipo==="pickup"){pickupLat=r.lat;pickupLng=r.lon;pickupName=r.name;pickupInput.value=r.name;pickupSuggestions.classList.remove("show");if(pickupMarker)map.removeLayer(pickupMarker);pickupMarker=L.marker([r.lat,r.lon]).addTo(map).bindPopup("RECOGER: "+r.name).openPopup();map.setView([r.lat,r.lon],16);}else{destinationLat=r.lat;destinationLng=r.lon;destName=r.name;destinationInput.value=r.name;destinationSuggestions.classList.remove("show");if(destinationMarker)map.removeLayer(destinationMarker);destinationMarker=L.marker([r.lat,r.lon]).addTo(map).bindPopup("ENTREGAR: "+r.name).openPopup();map.setView([r.lat,r.lon],16);} lucide.createIcons();};c.appendChild(el);});c.classList.add("show"); lucide.createIcons();}
let t1=null;pickupInput.addEventListener("input",function(){const txt=this.value.trim();if(t1)clearTimeout(t1);if(txt.length<2){pickupSuggestions.classList.remove("show");return;}t1=setTimeout(async()=>{const res=await buscarColonias(txt);mostrar(pickupSuggestions,res,"pickup");},120);});
let t2=null;destinationInput.addEventListener("input",function(){const txt=this.value.trim();if(t2)clearTimeout(t2);if(txt.length<2){destinationSuggestions.classList.remove("show");return;}t2=setTimeout(async()=>{const res=await buscarColonias(txt);mostrar(destinationSuggestions,res,"destination");},120);});

for(let i=0;i<70;i++){let d=document.createElement("div");d.className="rain";d.style.left=Math.random()*100+"%";d.style.animationDelay=Math.random()*1.2+"s";d.style.animationDuration=(0.5+Math.random()*0.6)+"s";d.style.opacity=0.6+Math.random()*0.4;rainOverlay.appendChild(d);}
async function checarLluvia(){
try{
const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=21.1561&longitude=-100.9333&current=temperature_2m,precipitation,rain,weather_code&timezone=America/Mexico_City");
const data=await r.json();
const precip=data.current.precipitation;
const temp=Math.round(data.current.temperature_2m);
const code=data.current.weather_code;
let estaLloviendo=precip>0||(code>=51&&code<=99);
if(!estaLloviendo){extraLluvia=0;rainOverlay.classList.remove("active");weatherBadge.classList.remove("show");weatherWidget.className="weather-widget";weatherWidget.innerHTML=`<i data-lucide="sun" style="width:14px"></i> ${temp}°C`;lucide.createIcons();return;}
if(code>=95||precip>7.5||code==65||code==82){extraLluvia=10;weatherWidget.className="weather-widget tormenta";weatherWidget.innerHTML=`<i data-lucide="cloud-lightning" style="width:14px;color:#fff"></i> ${temp}°C Fuerte`;document.getElementById('weatherBadgeTxt').innerText=`LLOVIENDO EN DOLORES - Fuerte (${precip}mm) +$10`;weatherBadge.className="weather-badge show tormenta";}
else if(code==53||code==63||code==81||code==55||(precip>=2.5&&precip<=7.5)){extraLluvia=5;weatherWidget.className="weather-widget lluvia";weatherWidget.innerHTML=`<i data-lucide="cloud-rain" style="width:14px"></i> ${temp}°C Moderada`;document.getElementById('weatherBadgeTxt').innerText=`LLOVIENDO EN DOLORES - Moderada (${precip}mm) +$5`;weatherBadge.className="weather-badge show moderada";}
else{extraLluvia=0;weatherWidget.className="weather-widget lluvia";weatherWidget.innerHTML=`<i data-lucide="cloud-drizzle" style="width:14px"></i> ${temp}°C Leve`;document.getElementById('weatherBadgeTxt').innerText=`LLOVIENDO EN DOLORES - Leve (${precip}mm) +$0`;weatherBadge.className="weather-badge show leve";}
rainOverlay.classList.add("active");lucide.createIcons();
}catch(e){weatherWidget.innerHTML=`<i data-lucide="sun" style="width:14px"></i> --°C`; lucide.createIcons();}
}
checarLluvia(); setInterval(checarLluvia,600000);

document.getElementById("calculateButton").onclick=async()=>{
 if(!pickupLat||!destinationLat){alert("Selecciona donde recoger y donde entregar");return;}
 const url=`https://router.project-osrm.org/route/v1/foot/${pickupLng},${pickupLat};${destinationLng},${destinationLat}?overview=full&geometries=geojson`;
 const r=await fetch(url);const d=await r.json();if(!d.routes||!d.routes[0]){alert("No se pudo trazar ruta");return;}
 const route=d.routes[0];
 const km=route.distance/1000;
 ultimaDistKm=km; ultimoTiempo=Math.ceil(route.duration/60);
 let baseMoto=35, baseCarro=55;
 if(route.distance>2000){let extra=route.distance-2000;baseMoto=35+Math.ceil(extra/650)*5; baseCarro=55+Math.ceil(extra/650)*8;}
 if(distMts(pickupLat,pickupLng,CENTRO.lat,CENTRO.lng)>800&&distMts(destinationLat,destinationLng,CENTRO.lat,CENTRO.lng)>800){baseMoto+=5; baseCarro+=10;}
 let esSOP_Lindavista = (pickupName.toLowerCase().includes("sop") && destName.toLowerCase().includes("linda")) || (destName.toLowerCase().includes("sop") && pickupName.toLowerCase().includes("linda"));
 if(esSOP_Lindavista){ baseMoto=45; baseCarro=65; }
 precioMoto=baseMoto+extraLluvia;
 precioCarro=baseCarro+extraLluvia;
 if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.geoJSON(route.geometry,{style:{color:"#E53935",weight:6}}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[40,40]});
 document.getElementById('rutaResumen').innerText=`${pickupName} → ${destName} • ${km.toFixed(2)} km • ${ultimoTiempo} min`;
 document.getElementById('precioMoto').innerText=`$${precioMoto} MXN`;
 document.getElementById('precioCarro').innerText=`$${precioCarro} MXN`;
 document.getElementById('detalleMoto').innerText=`${km.toFixed(2)} km • Llega 3 min`;
 document.getElementById('detalleCarro').innerText=`${km.toFixed(2)} km • Llega 5 min`;
 seleccionarTipo('moto');
 document.getElementById('modalTipo').classList.add('show');
 lucide.createIcons();
};

function seleccionarTipo(tipo){
 tipoSeleccionado=tipo;
 document.getElementById('cardMoto').classList.toggle('active',tipo==='moto');
 document.getElementById('cardCarro').classList.toggle('active',tipo==='carro');
 document.getElementById('selTitulo').innerText=(tipo==='moto'?'MOTO':'CARRO')+` • $${tipo==='moto'?precioMoto:precioCarro} MXN`;
 document.getElementById('selDetalle').innerText=`De ${pickupName} a ${destName} • ${ultimaDistKm.toFixed(2)} km`;
 document.getElementById('btnConfirmTipo').innerText=tipo.toUpperCase();
 let icon=document.getElementById('selIcon'); if(icon){icon.setAttribute('data-lucide',tipo==='moto'?'bike':'car'); lucide.createIcons();}
}
function cerrarModal(){ document.getElementById('modalTipo').classList.remove('show'); }
function confirmarViaje(){
 const precio=tipoSeleccionado==='moto'?precioMoto:precioCarro;
 alert(`Viaje ${tipoSeleccionado.toUpperCase()} confirmado\nDe: ${pickupName}\nA: ${destName}\nPrecio: $${precio} MXN\nBuscando conductor...`);
 cerrarModal();
}
document.getElementById('btnWa').onclick=()=>{
 const precio=tipoSeleccionado==='moto'?precioMoto:precioCarro;
 const linkRuta=`https://www.google.com/maps/dir/${pickupLat},${pickupLng}/${destinationLat},${destinationLng}`;
 const mensaje=`COTIZACION KIGO XPRESS ${tipoSeleccionado.toUpperCase()}\n\nRecoger: ${pickupName}\nEntregar: ${destName}\nDistancia: ${ultimaDistKm.toFixed(2)} km\nValor: $${precio} MXN\n\nVer ruta: ${linkRuta}\n\nConfirmamos servicio?`;
 window.open(`https://wa.me/?text=${encodeURIComponent(mensaje)}`,"_blank");
};
document.getElementById("resetBtn").onclick=()=>{
 pickupLat=null;pickupLng=null;destinationLat=null;destinationLng=null;pickupName="";destName="";
 pickupInput.value="";destinationInput.value="";
 if(pickupMarker)map.removeLayer(pickupMarker);if(destinationMarker)map.removeLayer(destinationMarker);if(routeLayer)map.removeLayer(routeLayer);
 map.setView([CENTRO.lat,CENTRO.lng],14);
 cerrarModal();
};
document.addEventListener("click",e=>{if(!e.target.closest(".input-wrapper")){pickupSuggestions.classList.remove("show");destinationSuggestions.classList.remove("show");}});
lucide.createIcons();
</script>
</body>
</html>
