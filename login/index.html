<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kigo - Ubicación</title>
<style>
  body{margin:0;background:#FAFAFA;font-family:'Inter',-apple-system,sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;}
  .card{background:white;width:88%;max-width:360px;border-radius:20px;padding:32px 24px;box-shadow:0 8px 30px rgba(0,0,0,0.08);text-align:center;}
  .icon{width:120px;height:120px;margin:0 auto 16px auto;display:block;}
  h2{font-size:24px;font-weight:800;color:#111;margin:0 0 10px 0;letter-spacing:-0.5px;}
  p{font-size:14.5px;color:#6B7280;line-height:1.4;margin:0 0 28px 0;}
  .btn-red{width:100%;background:#E91E3A;border:2px solid #E91E3A;color:white;padding:14px;border-radius:50px;font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 0 14px rgba(233,30,58,0.45);margin-bottom:12px;}
  .btn-white{width:100%;background:white;border:1.5px solid #9CA3AF;color:#374151;padding:13px;border-radius:50px;font-weight:600;font-size:15px;cursor:pointer;}
  .privacy{margin-top:22px;font-size:12px;color:#6B7280;text-decoration:underline;cursor:pointer;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:10;}
  .modal{background:white;border-radius:18px;padding:20px;width:85%;max-width:340px;text-align:center;}
  #pedido{display:none;margin-top:20px;}
</style>
</head>
<body>

<div class="card" id="cardPrincipal">
  <!-- ICONO - puedes usar tu PNG -->
  <div class="icon">
    <svg viewBox="0 0 100 100" width="100%" height="100%">
      <path d="M50 10 C35 10 25 25 35 35 L50 50 L65 35 C75 25 65 10 50 10 Z" fill="#E91E3A"/>
      <circle cx="50" cy="28" r="8" fill="white"/>
      <path d="M20 60 Q50 40 80 60 L75 75 Q50 60 25 75 Z" fill="#E5E7EB"/>
      <path d="M55 65 L70 68 L68 78 L55 75 Z" fill="none" stroke="#E91E3A" stroke-width="2.5"/>
    </svg>
  </div>

  <h2>Permite tu ubicación</h2>
  <p>Necesitamos tu ubicación para poder asignar el transportador más cercano y brindarte un mejor servicio.</p>

  <button class="btn-red" onclick="pedirUbicacion()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    Permitir ubicación
  </button>
  
  <button class="btn-white" onclick="mostrarCancelar()">Cancelar</button>

  <div id="pedido">
    <hr style="margin:20px 0;border:none;border-top:1px solid #eee;">
    <h3 style="color:#00C851;margin:0;">✅ Ubicación confirmada</h3>
    <p style="margin:8px 0 0 0;">Ya puedes continuar con tu pedido</p>
    <button class="btn-red" style="margin-top:14px;background:#00C851;border-color:#00C851;box-shadow:0 0 14px rgba(0,200,81,0.45);">Hacer pedido ahora</button>
  </div>
</div>

<a class="privacy" onclick="alert('Política: tu ubicación solo se usa para asignar el repartidor')">Políticas de privacidad</a>

<!-- MODAL CANCELAR -->
<div class="overlay" id="overlayCancelar">
  <div class="modal">
    <h3 style="margin:0;">Lo sentimos</h3>
    <p style="color:#666;font-size:14px;margin:10px 0 18px;">Si no permites tu ubicación no podrás continuar.</p>
    <div style="display:flex;gap:10px;">
      <button class="btn-white" style="flex:1;" onclick="window.location.href='https://www.google.com'">Cerrar sesión</button>
      <button class="btn-red" style="flex:1;margin:0;" onclick="cerrarModal()">Deseo continuar</button>
    </div>
  </div>
</div>

<script>
function pedirUbicacion(){
  navigator.geolocation.getCurrentPosition((pos)=>{
    document.getElementById('pedido').style.display='block';
    localStorage.setItem('kigo_gps', JSON.stringify(pos.coords));
  }, ()=>{
    alert("Activa el GPS y dale a Permitir en la ventana del celular");
  });
}
function mostrarCancelar(){
  document.getElementById('overlayCancelar').style.display='flex';
}
function cerrarModal(){
  document.getElementById('overlayCancelar').style.display='none';
}
</script>
</body>
</html>
