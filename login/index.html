<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kigo</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#fff;font-family:-apple-system,Inter,sans-serif;display:flex;flex-direction:column;min-height:100vh;}
  .top-banner{width:100%;max-height:260px;object-fit:cover;display:block;}
  .center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;}
  .card{background:#fff;width:100%;max-width:360px;border-radius:22px;padding:30px 22px;box-shadow:0 10px 35px rgba(0,0,0,0.10);text-align:center;border:1px solid #f1f1f1;}
  h2{font-size:25px;font-weight:800;margin:12px 0 10px 0;color:#111;}
  p{font-size:14.5px;color:#6B7280;line-height:1.45;margin:0 0 28px 0;}
  .btn-red{width:100%;background:#ED1C3A;border:none;color:#fff;padding:15px;border-radius:100px;font-weight:700;font-size:16px;display:flex;justify-content:center;align-items:center;gap:8px;cursor:pointer;box-shadow:0 0 18px rgba(237,28,58,0.5);margin-bottom:14px;}
  .btn-outline{width:100%;background:#fff;border:1.5px solid #9AA0A6;color:#3C4043;padding:14px;border-radius:100px;font-weight:600;font-size:15px;cursor:pointer;}
  .privacy{margin-top:26px;font-size:13px;color:#5F6368;text-decoration:underline;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:20;justify-content:center;align-items:center;}
  .modal{background:#fff;border-radius:20px;width:88%;max-width:340px;padding:22px;text-align:center;}
  #ok{display:none;margin-top:20px;border-top:1px solid #eee;padding-top:18px;}
</style>
</head>
<body>

<!-- RUTA CORREGIDA: como el index está dentro de /login/, subimos un nivel con ../ -->
<img src="../kigo-banner.jpg" class="top-banner" onerror="this.src='kigo-banner.jpg'; this.onerror=null;">

<div class="center">
  <div class="card">
    <svg width="110" height="90" viewBox="0 0 110 90" style="margin:0 auto;display:block;">
      <path d="M55 8 C38 8 28 20 36 30 L55 48 L74 30 C82 20 72 8 55 8 Z" fill="#ED1C3A"/>
      <circle cx="55" cy="24" r="8" fill="white"/>
      <path d="M15 55 L30 45 L50 55 L70 45 L95 55 L85 70 L15 70 Z" fill="#E5E7EB" />
      <g transform="translate(32,38)"><circle cx="12" cy="8" r="6" fill="#111"/><rect x="0" y="10" width="24" height="4" rx="2" fill="#111"/><rect x="2" y="15" width="6" height="10" fill="#111"/><rect x="16" y="15" width="6" height="10" fill="#111"/><circle cx="4" cy="27" r="5" fill="#111"/><circle cx="20" cy="27" r="5" fill="#111"/></g>
      <path d="M68 58 Q80 55 75 68" stroke="#ED1C3A" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g stroke="#ED1C3A" stroke-width="3" stroke-linecap="round"><line x1="18" y1="22" x2="28" y2="16"/><line x1="18" y1="30" x2="32" y2="30"/><line x1="82" y1="22" x2="92" y2="16"/><line x1="82" y1="30" x2="96" y2="30"/></g>
    </svg>

    <h2>Permite tu ubicación</h2>
    <p>Necesitamos tu ubicación para poder asignar el transportador más cercano y brindarte un mejor servicio.</p>

    <button class="btn-red" onclick="permitir()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      Permitir ubicación
    </button>
    <button class="btn-outline" onclick="cancelar()">Cancelar</button>

    <div id="ok">
      <h3 style="color:#00C851;margin:0;">✅ Ubicación confirmada</h3>
      <p style="margin:8px 0 12px 0;">Ya puedes hacer tu pedido</p>
      <button class="btn-red" style="background:#00C851;box-shadow:0 0 15px rgba(0,200,81,0.5);">Continuar pedido</button>
    </div>
  </div>
  <div class="privacy">Políticas de privacidad</div>
</div>

<div class="overlay" id="modal">
  <div class="modal">
    <h3 style="margin:0;">Lo sentimos</h3>
    <p style="color:#666;font-size:14px;margin:12px 0 18px;">Si no permites tu ubicación no podrás continuar.</p>
    <div style="display:flex;gap:10px;">
      <button class="btn-outline" style="flex:1;" onclick="location.href='https://www.google.com'">Cerrar sesión</button>
      <button class="btn-red" style="flex:1;margin:0;" onclick="document.getElementById('modal').style.display='none'">Deseo continuar</button>
    </div>
  </div>
</div>

<script>
function permitir(){
  navigator.geolocation.getCurrentPosition(p=>{
    document.getElementById('ok').style.display='block';
  }, e=>{
    alert('Debes darle a PERMITIR en la ventana de arriba de tu celular');
  });
}
function cancelar(){
  document.getElementById('modal').style.display='flex';
}
</script>
</body>
</html>
