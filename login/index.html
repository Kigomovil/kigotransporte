<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kigo - Verificación</title>
<style>
  body{margin:0;background:#fff;font-family:'Inter',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;}
  .card{width:92%;max-width:420px;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.12);overflow:hidden;border:1px solid #eee;}
  .banner{width:100%;display:block;}
  .content{padding:18px;text-align:center;}
  h2{font-size:16px;font-weight:800;color:#111;margin:8px 0 18px 0;white-space:nowrap;}
  .buttons{display:flex;gap:12px;}
  .btn{flex:1;padding:12px;border-radius:50px;border:2px solid;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
  .btn-cancel{background:#FFECEC;border-color:#FF5A5A;color:#B00000;box-shadow:0 0 12px rgba(255,90,90,0.6);}
  .btn-permitir{background:#E8FFE8;border-color:#00C851;color:#fff;box-shadow:0 0 12px rgba(0,200,81,0.6);background-color:#00C851;}
  
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);justify-content:center;align-items:center;z-index:10;}
  .modal-card{background:#fff;width:90%;max-width:360px;border-radius:18px;padding:20px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,0.2);}
  #formPedido{display:none;padding:20px;text-align:center;}
</style>
</head>
<body>

<!-- TARJETA PRINCIPAL -->
<div class="card" id="mainCard">
  <img src="kigo-banner.jpg" class="banner">
  <div class="content">
    <h2>En Kigo tu seguridad es primordial</h2>
    <div class="buttons">
      <button class="btn btn-cancel" onclick="mostrarCancelar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B00000" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        Cancelar
      </button>
      <button class="btn btn-permitir" onclick="accionPermitir()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
        Permitir
      </button>
    </div>
  </div>

  <!-- ESTO APARECE DESPUÉS DE PERMITIR -->
  <div id="formPedido">
    <h3 style="color:#00C851;">✅ Ubicación confirmada</h3>
    <p style="font-size:14px;color:#555;">Ahora puedes hacer tu pedido</p>
    <button class="btn btn-permitir" style="width:100%;margin-top:10px;">Continuar con mi pedido</button>
  </div>
</div>

<!-- MODAL CANCELAR -->
<div class="overlay" id="overlayCancelar">
  <div class="modal-card">
    <h3>Lo sentimos</h3>
    <p style="font-size:14px;color:#666;">Si no permites tu ubicación no podrás continuar.</p>
    <div class="buttons" style="margin-top:18px;">
      <button class="btn btn-cancel" onclick="cerrarSesion()">Cerrar sesión</button>
      <button class="btn btn-permitir" onclick="volverInicio()">Deseo continuar</button>
    </div>
  </div>
</div>

<script>
function accionPermitir(){
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      console.log("GPS:", pos.coords);
      // Aquí se quita el permiso y aparece el pedido
      document.querySelector('.content').style.display='none';
      document.getElementById('formPedido').style.display='block';
    },
    ()=>{
      alert("Debes darle a PERMITIR en la ventana de tu celular");
    }
  );
}
function mostrarCancelar(){
  document.getElementById('overlayCancelar').style.display='flex';
}
function cerrarSesion(){
  window.location.href="https://www.google.com";
}
function volverInicio(){
  document.getElementById('overlayCancelar').style.display='none';
}
</script>
</body>
</html>
